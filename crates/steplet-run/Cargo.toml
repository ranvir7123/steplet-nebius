[package]
name = "steplet-run"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
steplet-core = { path = "../steplet-core" }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", features = ["rt", "net", "io-util", "time", "sync"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading"] }
