# Steplet product code. spikes/ is a separate, throwaway workspace and is not part of this one.
[workspace]
resolver = "3"
members = ["crates/steplet-core", "crates/steplet-sign", "crates/steplet-wasm", "crates/steplet-run", "crates/steplet-gate", "crates/steplet-app", "crates/steplet-suite"]
exclude = ["spikes", "crates/steplet-core/fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false
